<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方域大陆 Leon's · 地铁换乘查询</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <div class="logo">🚇</div>
  <div>
    <h1>方域大陆 Leon's <span style="font-weight:400;opacity:.85">地铁换乘查询</span></h1>
    <div class="sub">FANGYU LAND · METRO TRANSFER</div>
  </div>
  <div class="spacer"></div>
  <div class="hint">左侧输入站点，或直接在地图上点击站点选择起终点</div>
</header>

<div class="app-body">
  <!-- ============ 左侧：查询 + 结果 ============ -->
  <aside class="sidebar">
    <div class="controls">
      <div class="od-wrap">
        <div class="od-fields">
          <div class="station-field origin">
            <span class="dot"></span>
            <input id="origin-input" type="text" placeholder="起点站，如：碉堡城区" autocomplete="off" spellcheck="false">
            <button class="clear" type="button" title="清除">✕</button>
            <div class="ac-list" id="origin-ac" hidden></div>
          </div>
          <div class="station-field dest">
            <span class="dot"></span>
            <input id="dest-input" type="text" placeholder="终点站，如：欧城欧堡" autocomplete="off" spellcheck="false">
            <button class="clear" type="button" title="清除">✕</button>
            <div class="ac-list" id="dest-ac" hidden></div>
          </div>
        </div>
        <button id="swap-btn" class="swap-btn" type="button" title="交换起点与终点">⇅</button>
      </div>

      <div class="prefs">
        <span class="label">出行偏好</span>
        <div class="seg">
          <button type="button" data-pref="recommend" class="active">推荐</button>
          <button type="button" data-pref="transfer">少换乘</button>
          <button type="button" data-pref="stops">少站点</button>
        </div>
      </div>
    </div>

    <div class="result" id="result"></div>
  </aside>

  <!-- ============ 右侧：地铁图 ============ -->
  <main class="map-wrap">
    <div id="map-container">
